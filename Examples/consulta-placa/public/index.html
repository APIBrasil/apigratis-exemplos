<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta de Placa</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#76051a;background:white}*{box-sizing:border-box}body{margin:0;padding:70px 20px}.search{border:4px solid #76051a;max-width:490px;margin:0 auto 50px;padding:22px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.search input{min-width:0;flex:1 1 200px;padding:12px;border:1px solid #a76c79;font-size:16px;text-transform:uppercase}.search button{background:#76051a;color:white;border:0;padding:12px 22px;font-size:15px;cursor:pointer}.search button:disabled{opacity:.6;cursor:wait}.panel{border:4px solid #76051a;max-width:1006px;margin:auto;min-height:545px;padding:70px 44px}.fields{line-height:1.5}.fields strong{font-weight:400}.message{margin-top:20px}.error{color:#b00020}.alternatives{margin-top:28px}.alternatives li{margin-bottom:10px}.demo{font-size:13px;color:#855e66}@media(max-width:600px){body{padding:30px 12px}.panel{padding:32px 20px;min-height:400px}.search{margin-bottom:30px}}
</style></head><body><form class="search" id="form"><input id="placa" placeholder="INSIRA A PLACA" aria-label="Placa do veículo" maxlength="8" required autocomplete="off"><button id="botao" type="submit">CONSULTAR</button></form><main class="panel"><div class="fields"><div>Placa: <strong id="out-placa"></strong></div><div>Marca: <strong id="out-marca"></strong></div><div>Ano: <strong id="out-ano"></strong></div><div>Modelo: <strong id="out-modelo"></strong></div><div>FIPE: <strong id="out-fipe"></strong></div></div><p id="message" class="message" role="status" aria-live="polite"></p><section id="alternatives" class="alternatives" hidden><h3>Outras versões FIPE possíveis</h3><ul id="lista"></ul></section></main><script>
const $=id=>document.getElementById(id);const money=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});$('form').addEventListener('submit',async event=>{event.preventDefault();const placa=$('placa').value.toUpperCase().replace(/[\s-]/g,'');$('message').textContent='Consultando...';$('message').className='message';$('alternatives').hidden=true;for(const id of ['out-placa','out-marca','out-ano','out-modelo','out-fipe'])$(id).textContent='';$('botao').disabled=true;try{const response=await fetch('/api/consultar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({placa})});const data=await response.json();if(!response.ok)throw new Error(data.erro||'Erro na consulta');const principal=data.resultados.find(r=>r.principal)||data.resultados[0];$('out-placa').textContent=data.placa;$('out-marca').textContent=principal.marca??'Não informado';$('out-ano').textContent=principal.ano??'Não informado';$('out-modelo').textContent=principal.modelo??'Não informado';$('out-fipe').textContent=(principal.valor!==null?money.format(principal.valor):'Não informado')+(principal.codigoFipe?' (código '+principal.codigoFipe+')':'');$('message').textContent=(data.demonstracao?'MODO DEMONSTRAÇÃO — dados fictícios de teste baseados no exemplo fornecido. ':'')+(principal.mesReferencia?'Referência: '+principal.mesReferencia+'. ':'')+(data.resultados.length>1?'Existem outras versões FIPE possíveis.':'');const outras=data.resultados.filter(r=>r!==principal);if(outras.length){$('alternatives').hidden=false;$('lista').replaceChildren(...outras.map(r=>{const li=document.createElement('li');li.textContent=`${r.modelo??'Modelo não informado'} — ${r.valor!==null?money.format(r.valor):'Sem valor'} (código ${r.codigoFipe??'N/D'})`;return li;}));}}catch(err){$('message').textContent=err.message;$('message').className='message error';}finally{$('botao').disabled=false;}});
</script></body></html>
